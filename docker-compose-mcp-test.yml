# Docker Compose for running the MCP server test suite in an isolated
# environment. It starts a throwaway API server (plus Postgres, Valkey,
# RabbitMQ and MinIO) and runs the MCP pytest suite against it.
#
# Prerequisite:
#   ./setup.sh    # creates apps/api/.env (and the other env files) from .env.example
#
# Usage:
#   # Run the MCP tests:
#   docker compose -f docker-compose-mcp-test.yml up --build --abort-on-container-exit --exit-code-from mcp-tests
#
#   # Run a subset by overriding the command:
#   docker compose -f docker-compose-mcp-test.yml run --rm --build mcp-tests python -m pytest -k "test_name"
#
#   # Tear down (removes ephemeral volumes and the test network):
#   docker compose -f docker-compose-mcp-test.yml down -v
#
# Notes:
# - Postgres / Valkey / RabbitMQ / MinIO start with health checks; the API
#   server only starts once each dependency is healthy, and the test runner
#   only starts once the API server is healthy.
# - Data dirs are tmpfs so every run begins from a clean state.
# - Env vars come from apps/api/.env (the same file the local stack uses); the
#   API uses plane.settings.test, which inherits from common and reads
#   DATABASE_URL, REDIS_URL, RABBITMQ_* etc. from the environment.

services:
  test-db:
    image: postgres:15.7-alpine
    networks:
      - test_env
    env_file:
      - ./apps/api/.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-plane}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plane}
      POSTGRES_DB: ${POSTGRES_DB:-plane}
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-plane} -d ${POSTGRES_DB:-plane}"]
      interval: 5s
      timeout: 5s
      retries: 10

  test-redis:
    image: valkey/valkey:7.2.11-alpine
    networks:
      - test_env
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  test-mq:
    image: rabbitmq:3.13.6-management-alpine
    networks:
      - test_env
    env_file:
      - ./apps/api/.env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-plane}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-plane}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-plane}
    tmpfs:
      - /var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  test-minio:
    image: minio/minio
    networks:
      - test_env
    env_file:
      - ./apps/api/.env
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-access-key}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-secret-key}
    # Start the server in the background, create the bucket, then keep the
    # container alive by waiting on the server process.
    entrypoint: >
      /bin/sh -c "
      mkdir -p /export/${AWS_S3_BUCKET_NAME:-uploads} &&
      (minio server /export --console-address ':9090' &) &&
      sleep 3 &&
      mc alias set local http://localhost:9000 ${AWS_ACCESS_KEY_ID:-access-key} ${AWS_SECRET_ACCESS_KEY:-secret-key} &&
      (mc mb local/${AWS_S3_BUCKET_NAME:-uploads} -p || true) &&
      tail -f /dev/null
      "
    tmpfs:
      - /export
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  test-api-server:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
    networks:
      - test_env
    env_file:
      - ./apps/api/.env
    environment:
      DJANGO_SETTINGS_MODULE: plane.settings.test
      # Override service hostnames to point at the test-only services above.
      POSTGRES_HOST: test-db
      DATABASE_URL: postgresql://${POSTGRES_USER:-plane}:${POSTGRES_PASSWORD:-plane}@test-db:5432/${POSTGRES_DB:-plane}
      REDIS_HOST: test-redis
      REDIS_URL: redis://test-redis:6379/
      RABBITMQ_HOST: test-mq
      AWS_S3_ENDPOINT_URL: http://test-minio:9000
      # Magic-link flows check that EMAIL_HOST is configured before sending.
      # Set a placeholder so the check passes.
      EMAIL_HOST: test-smtp.invalid
    volumes:
      - ./apps/api:/code
    working_dir: /code
    depends_on:
      test-db:
        condition: service_healthy
      test-redis:
        condition: service_healthy
      test-mq:
        condition: service_healthy
      test-minio:
        condition: service_healthy
    command: >
      /bin/sh -c "
      python manage.py migrate --noinput &&
      python manage.py runserver 0.0.0.0:8000
      "
    healthcheck:
      # Plain TCP connect: no dependency on curl and no auth needed.
      test: ["CMD-SHELL", "python -c \"import socket; s = socket.socket(); s.settimeout(2); s.connect(('127.0.0.1', 8000))\" || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 40
      # Migrations on a fresh database can take a while; failures during this
      # window don't count toward retries.
      start_period: 60s

  mcp-tests:
    build:
      context: ./apps/mcp_server
      dockerfile: Dockerfile
    networks:
      - test_env
    env_file:
      - ./apps/api/.env
    environment:
      OPENAPI_DOCS_URL: http://test-api-server:8000/api/schema/?format=json
      PLANE_API_URL: http://test-api-server:8000/api/v1
      DATABASE_URL: postgresql://${POSTGRES_USER:-plane}:${POSTGRES_PASSWORD:-plane}@test-db:5432/${POSTGRES_DB:-plane}
      REDIS_URL: redis://test-redis:6379/
    volumes:
      - ./apps/mcp_server:/app
    working_dir: /app
    depends_on:
      test-api-server:
        condition: service_healthy
      test-db:
        condition: service_healthy
      test-redis:
        condition: service_healthy
    command: >
      /bin/sh -c "
      pip install --no-cache-dir pytest pytest-asyncio &&
      python -m pytest
      "

networks:
  test_env:
    driver: bridge